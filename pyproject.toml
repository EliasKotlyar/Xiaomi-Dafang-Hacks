[tool.codespell]
# The configuration must be kept here to ensure that
# `codespell` can be run as a standalone program from the CLI
# with the appropriate default options.

skip=".git,.cache,*.pdf,*/firmware_mod/www/lib"

check-hidden = true
quiet-level=2
ignore-regex = '\\[fnrstv]'
builtin = "clear,rare,informal,code,names"

ignore-words-list="lable,ser,nome,EMAC"
#ignore-words = "codespell/codespell-ignore.txt"
#exclude-file = "codespell/codespell-lines-ignore.txt"
#uri-ignore-words-list="wordlist"

# For future reference: it is not currently possible to specify
# the standard dictionary and the custom dictionary in the configuration
# file
#  D = "-"
#  dictionary = "dev/tools/codespell/codespell-dict.txt"


[tool.yamlfix]
# allow_duplicate_keys = true
line_length = 80
